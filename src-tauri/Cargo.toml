[package]
name = "lumen"
version = "0.1.0"
description = "Универсальный лаунчер в стиле Raycast / PowerToys Run"
authors = ["lsdasy"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[lib]
name = "lumen_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
log = "0.4.35"
lumen-core = { path = "../crates/lumen-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.11.6", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-log = "2.9.2"
tauri-plugin-single-instance = "2.4.5"
window-vibrancy = "0.8.1"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
