[package]
name = "lumen-core"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
log = "0.4.35"
notify = "8.2.1"
notify-debouncer-mini = "0.7.0"
open = "5.4.5"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "time", "rt", "macros", "io-util"] }
walkdir = "2.5.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
