# Выпуск релиза: на тег vX.Y.Z собираются установщики для Windows, macOS (Apple Silicon и Intel)
# и Linux, выкладываются в GitHub Release, затем добавляется SHA256SUMS — его проверяют install.ps1 / install.sh.
#
#   git tag v0.1.0
#   git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ""
          - name: macOS Apple Silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
      - name: Системные библиотеки (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lumen ${{ github.ref_name }}"
          releaseBody: |
            **Windows:** `irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex`
            **macOS / Linux:** `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash`

            Или скачайте установщик ниже: `*-setup.exe` / `*.msi` — Windows, `*.dmg` — macOS, `*.AppImage` / `*.deb` — Linux.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Посчитать контрольные суммы и приложить к релизу
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.exe' --pattern '*.msi' --pattern '*.dmg' --pattern '*.AppImage' --pattern '*.deb'
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
